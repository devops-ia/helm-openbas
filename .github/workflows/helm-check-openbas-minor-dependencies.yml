name: Check OpenAEV minor dependencies releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # every monday

permissions:
  contents: read
  pull-requests: write

jobs:
  check-and-update-minor-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare updatecli configuration
        id: dependencies
        run: |
          # get name dependencies
          dependencies=($(yq eval -o=json '.dependencies[] | .name' charts/openaev/Chart.yaml | xargs))

          # replace version
          for dependency in "${dependencies[@]}"; do
            version="~$(yq eval -r ".dependencies[] | select(.name == \"${dependency}\") | .version" charts/openaev/Chart.yaml | cut -d'.' -f1)"
            yq eval -i ".sources.${dependency}.spec.versionFilter.pattern = \"${version}\"" .github/updatecli/helm-dependencies.yaml
          done

      - name: Install updatecli
        uses: updatecli/updatecli-action@5dfc616e57b07d2302c3f37e5b72a4ead82dbbf8 # v3.4.0

      - name: Update dependencies
        run: |
          updatecli apply --config .github/updatecli/helm-dependencies.yaml --commit=false 2>&1 | tee > $GITHUB_WORKSPACE/tmp-minor-output.log
          awk '/TARGETS/{flag=1;next}/ACTIONS/{flag=0}flag' $GITHUB_WORKSPACE/tmp-minor-output.log > $GITHUB_WORKSPACE/clean-minor-output.log
          chmod +x .github/hack/prepare_body_pr.sh
          $GITHUB_WORKSPACE/.github/hack/prepare_body_pr.sh $GITHUB_WORKSPACE/clean-minor-output.log > $GITHUB_WORKSPACE/minor-output.log

          # show PR body
          cat minor-output.log
        shell: bash
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Update README.md Helm Chart
        uses: losisin/helm-docs-github-action@3a4528e97c49a5e83de6b78c50c61c8ee5c9f944 # v2.0.0
        with:
          chart-search-root: charts/openaev

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -I)" >> $GITHUB_OUTPUT

      - name: Create PR with changes (dry-run)
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.event_name == 'workflow_dispatch'
        with:
          add-paths: charts/openaev
          token: ${{ secrets.PAT_GITHUB }}
          commit-message: "fix: update minor dependencies version"
          signoff: false
          branch: fix/upgrade-openaev-minor-dependencies-${{ steps.date.outputs.date }}
          delete-branch: true
          title: '[openaev] upgrade minor dependencies (${{ steps.date.outputs.date }})'
          body-path: minor-output.log
          draft: true
          labels: |
            auto-pr-bump-version

      - name: Create PR with changes
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: github.event_name == 'schedule'
        with:
          add-paths: charts/openaev
          token: ${{ secrets.PAT_GITHUB }}
          commit-message: "fix: update minor dependencies version"
          signoff: false
          branch: fix/upgrade-openaev-minor-dependencies-${{ steps.date.outputs.date }}
          delete-branch: true
          title: '[openaev] upgrade minor dependencies (${{ steps.date.outputs.date }})'
          body-path: minor-output.log
          labels: |
            auto-pr-bump-version
